<!DOCTYPE html>
<html>
    <head>
        <title>figcaption,figur</title>
        <style>
            img{
                width:30%;
            }
            figure{
                display: inline-block;
                border: 1px solid red;
                border-radius: 4px;
                padding: 10px;
                margin: auto;
            }
            figcaption{
                background: black;
                color: white;
                text-align: center;
            }
        </style>
    </head>

    <body>
        <section>
            <figure>
                <img src="img/1.webp" alt="cloth">
                <figcaption>shirt1</figcaption>
            </figure>
            <figure>
                <img src="img/2.webp" alt="cloth2">
                <figcaption>shirt2</figcaption>
            </figure>
            <figure><img src="img/3.webp" alt="cloth3">
                <figcaption>shirt3</figcaption></figure>
            <figure>
                <img src="img/1.webp" alt="cloth4">
                <figcaption>shirt4</figcaption>
            </figure>
            <figure>
                <img src="img/3.webp" alt="cloth5">
                <figcaption>shirt5</figcaption>
            </figure>
        </section>
    </body>
</html>
