<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            font-size:18px;
        }
        a{
            text-decoration:none;
            background: linear-gradient(90deg,red,rgb(94, 88, 127));
            color: rgb(237, 232, 232);
            padding: 8px;
            margin: 10px;
            border: 1px solid red;
            border-radius: 15px;
            box-shadow:0px 0px 10px red;
        }
        a:hover{
            background: rgb(1, 52, 1);
        }
        a:nth-child(1){
            background: rgb(126, 153, 126);
        }
        a:nth-child(5){
            background: pink;
        }
    </style> 
</head>
<body>
    <nav align="center">
        <a href="#">Home</a> |
        <a href="#">Portfolio</a> |
        <a href="#">Contact</a> | 
        <a href="#">About</a> |
        <a href="#">Logout</a>
    </nav>
</body>
</html>
