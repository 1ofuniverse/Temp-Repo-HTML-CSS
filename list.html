<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>

    <style>
        ul,ol{
            background-color: aquamarine;
            width: 18% ;
            display: inline-block;
            border: 2px solid black;
            border-radius:10px;
            margin: 10px;
        }
        li{
            background-color:pink;
            padding: 8px;
        }

    </style>
</head>
<body>
    <ul>
        <li>hi</li>
        <li>joe</li>
        <li>ko</li>
        <li>bye</li>
    </ul>
    <ol type="A">
        <li>hi</li>
        <li>joe</li>
        <li>ko</li>
        <li>bye</li>
    </ol>
    <ol type="a">
        <li>hi</li>
        <li>joe</li>
        <li>ko</li>
        <li>bye</li>
    </ol>

    <ol type="I">
        <li>hi</li>
        <li>joe</li>
        <li>ko</li>
        <li>bye</li>
    </ol>
    <ol start="6">
        <li>hi</li>
        <li>joe</li>
        <li>ko</li>
        <li>byee</li>
    </ol>
    <ol start="6" reversed>
        <li>hi</li>
        <li>joe</li>
        <li>ko</li>
        <li>bye</li>
    </ol>
</body>
</html>
